name: HopBoard
options:
  bundleIdPrefix: io.zhoulab.hopboard
  deploymentTarget:
    iOS: "17.0"
packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    from: 1.0.0
targets:
  HopBoard:
    type: application
    platform: iOS
    sources:
      - Sources/App
      - Sources/Shared
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
      - target: HopBoardKeyboard
    info:
      # GENERATED from this block on every `make` — do not edit
      # Sources/App/Info.plist directly (same trap as hop-ios).
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: HopBoard
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: "HopBoard records only during a Session you start, so the HopBoard keyboard can transcribe your dictation on-device."
        # The whole architecture rests on this: the keyboard cannot touch the
        # mic, so the app keeps an active recording session alive in the
        # background for the keyboard to drive.
        UIBackgroundModes: [audio]
        CFBundleURLTypes:
          - CFBundleURLName: io.zhoulab.hopboard
            CFBundleURLSchemes: [hopboard]
    entitlements:
      # GENERATED like Info.plist — edit here, not the file.
      # Keychain group, not an App Group: the ASC API can't register App
      # Groups and Xcode has no signed-in account, but team dev profiles
      # carry keychain-access-groups 5AD7QB9795.* — shared storage that
      # provisions today. See Sources/Shared/FlowIPC.swift.
      path: HopBoard.entitlements
      properties:
        keychain-access-groups: ["$(AppIdentifierPrefix)io.zhoulab.hopboard.ipc"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.zhoulab.hopboard
        DEVELOPMENT_TEAM: 5AD7QB9795
        # Manual: this machine has no signed-in Xcode account, so the
        # profiles are minted through the ASC API (scripts/mint_profiles.md)
        # and pinned by name here.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        PROVISIONING_PROFILE_SPECIFIER: "HopBoard Dev"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  HopBoardKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Sources/Keyboard
      - Sources/Shared
    info:
      path: Sources/Keyboard/Info.plist
      properties:
        CFBundleDisplayName: HopBoard
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            # Full Access — required for the App Group IPC with the main app.
            RequestsOpenAccess: true
    entitlements:
      path: HopBoardKeyboard.entitlements
      properties:
        keychain-access-groups: ["$(AppIdentifierPrefix)io.zhoulab.hopboard.ipc"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.zhoulab.hopboard.keyboard
        DEVELOPMENT_TEAM: 5AD7QB9795
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        PROVISIONING_PROFILE_SPECIFIER: "HopBoard Keyboard Dev"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: 1
        SKIP_INSTALL: YES

  HopBoardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      # The pure layout and typing rules live in the KEYBOARD target, which
      # the app-hosted test bundle cannot see. Compiling those two files in
      # directly keeps them testable without exiling keyboard concerns into
      # Shared, where the app would carry them for nothing.
      - Sources/Keyboard/KeyLayout.swift
      - Sources/Keyboard/TypingEngine.swift
      - Sources/Keyboard/Autocorrect.swift
      # Enough of the key plane to RENDER it in a test. Shipping keyboard
      # chrome that has never been looked at is how the Insert pill got a
      # tap target the size of its label.
      - Sources/Keyboard/KeyFeedback.swift
      - Sources/Keyboard/KeyViews.swift
      - Sources/Keyboard/KeyPlane.swift
    dependencies:
      - target: HopBoard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.zhoulab.hopboard.tests
        DEVELOPMENT_TEAM: 5AD7QB9795
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HopBoard.app/HopBoard"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  HopBoard:
    build:
      targets:
        HopBoard: all
        HopBoardTests: [test]
    test:
      targets: [HopBoardTests]
    archive:
      config: Release
    run:
      config: Debug
